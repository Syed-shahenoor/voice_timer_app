<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Controlled Timer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Voice Timer</h1>
            <p>Control with your voice: <span class="badge">"Start"</span> <span class="badge">"Pause"</span> <span class="badge">"Stop"</span></p>
        </header>
        
        <main>
            <div class="timer-display timer-state-stopped">
                <span id="hours">00</span>:<span id="minutes">00</span>:<span id="seconds">00</span><span id="milliseconds">.00</span>
            </div>
            
            <div class="controls">
                <button id="mic-btn" class="mic-btn">
                    <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                    <span id="mic-status">Click to Enable Microphone</span>
                </button>
            </div>
            
            <div id="transcript" class="transcript-box">
                Waiting for commands...
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
